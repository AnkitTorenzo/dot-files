[general]
import = [
    "~/.config/alacritty/catppuccin-mocha.toml"
]


[window]
padding = {x = 3, y = 0}
opacity = 0.7
blur = true

[font]
normal =      {family = 'JetbrainsMono Nerd Fond', style = 'bold'}
bold =        {family = 'JetbrainsMono Nerd Fond', style = 'bold'}
italic =      {family = 'JetbrainsMono Nerd Fond', style = 'bold_italic'}
bold_italic = {family = 'JetbrainsMono Nerd Fond', style = 'bold'}

[cursor]
style = {shape = "underline", blinking = "always"}
unfocused_hollow = true

[env]
TERM = "xterm-256color"
